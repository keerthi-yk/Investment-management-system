<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Manager | Login</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (CDN build) -->
  <script src="https://cdn.tailwindcss.com/3.4.0"></script>
  <script>
    // Custom Tailwind config for brand palette + font
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              500: '#6366f1', // indigo‑500
              600: '#4f46e5', // indigo‑600
            },
          },
        },
      },
    };
  </script>
  <style>
    /* quick glassmorphism helper without extra build step */
    .glass {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    
  </style>
</head>
<body class="min-h-screen font-inter bg-gradient-to-br from-brand-600 via-purple-600 to-pink-500 flex items-center justify-center overflow-hidden relative p-6">
  <!-- Decorative blurred blobs -->
  <span aria-hidden="true" class="absolute -z-10 w-72 h-72 bg-purple-400 opacity-40 rounded-full filter blur-3xl animate-pulse -top-10 -left-20"></span>
  <span aria-hidden="true" class="absolute -z-10 w-80 h-80 bg-pink-400 opacity-40 rounded-full filter blur-3xl animate-pulse delay-150 top-1/3 right-[-6rem]"></span>

  <!-- Login card -->
  <div class="glass rounded-3xl p-10 w-full max-w-md shadow-2xl">
    <!-- Brand / Logo -->
    <div class="flex flex-col items-center mb-8 select-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8" />
      </svg>
      <h1 class="text-3xl font-semibold text-white tracking-tight drop-shadow-lg">Investment Manager</h1>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-6">
      <!-- Username -->
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-4 top-3.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A16.897 16.897 0 0 1 12 15.75c2.605 0 5.066.612 6.879 1.693M15 10.5A3 3 0 1 1 9 10.5a3 3 0 0 1 6 0z" />
        </svg>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="Username"
               class="pl-12 pr-4 py-3 w-full rounded-xl bg-white/80 border border-white/30 focus:ring-2 focus:ring-brand-500 focus:outline-none backdrop-blur placeholder-gray-500" />
      </div>

      <!-- Password -->
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-4 top-3.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 11.25v2.25m0 4.5h.008v-.008H12v.008z" />
          <rect width="18" height="11" x="3" y="10" rx="2" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 10V6.75a4.5 4.5 0 0 1 9 0V10" />
        </svg>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Password"
               class="pl-12 pr-4 py-3 w-full rounded-xl bg-white/80 border border-white/30 focus:ring-2 focus:ring-brand-500 focus:outline-none backdrop-blur placeholder-gray-500" />
      </div>

      <!-- Remember + forgot -->
      <div class="flex items-center justify-between text-sm">
        <label class="inline-flex items-center text-white/90 gap-2">
          <input type="checkbox" class="rounded border-white/40 bg-white/20 text-brand-600 focus:ring-brand-500" />
          Remember me
        </label>
        <a href="#" class="text-white/90 hover:text-white underline underline-offset-2">Forgot password?</a>
      </div>

      <!-- Button -->
      <button type="submit"
              class="w-full py-3 font-semibold rounded-xl bg-brand-500 backdrop-blur text-white shadow-lg hover:bg-brand-600 focus:ring-4 focus:ring-brand-500/50 transition active:scale-95">
        Sign&nbsp;in
      </button>

      <!-- Error message placeholder -->
      <p id="error" class="text-center text-red-200 mt-2 hidden"></p>
    </form>
  </div>

  <!-- Simple tilt animation -->
  <script>
    const card = document.querySelector('.glass');
    card.addEventListener('mousemove', (e) => {
      const { left, top, width, height } = card.getBoundingClientRect();
      const x = (e.clientX - left - width / 2) / 25;
      const y = (e.clientY - top - height / 2) / 25;
      card.style.transform = `rotateX(${ -y }deg) rotateY(${ x }deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    // Handle login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          window.location.href = '/dashboard.html';
        } else {
          const payload = await res.json().catch(() => ({}));
          showError(payload.message || 'Invalid credentials, please try again.');
        }
      } catch (err) {
        showError('Unable to reach the server. Please check your connection.');
      }
    });

    function showError(message) {
      const el = document.getElementById('error');
      el.textContent = message;
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
